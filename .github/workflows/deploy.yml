name: deploy

# Release pipeline for metaball.namche.ai. A merge to main that passes CI
# builds an immutable GHCR image and DISPATCHES its digest to
# NamcheAI/infra, which owns the tailnet join, the host keys and the deploy
# credential.
#
# Same shape as NamcheAI/ui's deploy.yml, with the same deliberate
# simplification: this app has no staging twin, so main goes straight to
# production and there is no tag-promotion workflow. It is a single Studio
# editor instance behind a PIN gate, not a multi-tenant service with a
# schema to migrate, so the thing a staging tier exists to de-risk is not
# present. If that ever changes, the pattern to copy is namche.ai's
# main -> staging / `v*` tag -> production pair, not a second branch here.
#
# v1 ships with no secrets configured on the host: METABALL_AUTH_* and
# OPENAI_API_KEY stay unset until an env file is added to the host
# out-of-band, so the deployed container serves the editor with the PIN
# gate and AI material rendering both dormant (auth disabled, render
# returns 503) until that follow-up lands.
#
# Default-branch-controlled: workflow_run always runs the base branch's
# definition of this file, so a pull request cannot change what publishes or
# where it deploys. ci.yml has already run typecheck, lint, tests and
# `npm run build` against this exact sha from main, so the build job does
# not re-run the suite; it publishes the resulting OCI image.
#
# Access model: this repo holds NO ssh key and NO tailnet access. Its only
# deploy credential is INFRA_DISPATCH_TOKEN, a fine-grained PAT whose sole
# power is triggering workflows on NamcheAI/infra (minted once for the estate
# and delivered by foundation/). A compromise of this repo cannot reach a host;
# at worst it can ask infra to deploy an image.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# One group for the whole build -> release pipeline: two merges in quick
# succession serialize rather than racing each other onto the host.
concurrency:
  group: deploy-release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/namcheai/metaball
  # Avoid the automatic, 90-day Docker build-record artifact per deploy.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  # Trusted main-only OCI build of the pushed sha. This is the ONLY job that
  # gets packages:write, and it only ever builds already-merged, ci-passed main.
  build:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.DEPLOYS_ENABLED == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR (build cache read+write)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # linux/amd64 (the estate's hosts) + provenance:false -> a single image
      # manifest, so the pushed digest is unambiguous and the deploy contract's
      # `<repo>@sha256:<64 hex>` pattern always matches what shipped.
      - name: Build and push OCI image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=registry,ref=${{ env.IMAGE }}/buildcache:main
          cache-to: type=registry,ref=${{ env.IMAGE }}/buildcache:main,mode=max

      - name: Record immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Malformed digest from Buildx: ${DIGEST}"
            exit 1
          fi
          echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  production:
    needs: build
    runs-on: ubuntu-latest
    # The environment binding is what scopes INFRA_DISPATCH_TOKEN (and any
    # required reviewers set on it) to a production release.
    environment: production
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      IMAGE_REF: ${{ needs.build.outputs.image }}
    steps:
      # A superseded run must skip rather than roll production back to the
      # older sha it happens to have finished building.
      - name: Verify sha is still main HEAD
        id: fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')
          if [ "$CURRENT" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Superseded: main is at ${CURRENT}, this run built ${HEAD_SHA}. Skipping release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      # Hand the digest to NamcheAI/infra. FIRE AND FORGET: a green step here
      # means "infra accepted the request for this digest", NOT "the host is
      # running it" -- the outcome lives in infra's Actions runs and in the
      # estate's monitoring.
      - name: Release to production (dispatch to infra)
        if: steps.fresh.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::INFRA_DISPATCH_TOKEN secret is empty -- cannot dispatch the release. Failing closed rather than reporting a deploy that never happened."
            exit 1
          fi
          # --ref main is REQUIRED: without it `gh` resolves the target repo's
          # default branch first, and that lookup needs `Contents: read`, which
          # the dispatch PAT deliberately does not carry.
          gh workflow run deploy-app.yml -R NamcheAI/infra --ref main \
            -f app=metaball \
            -f environment=production \
            -f image="$IMAGE_REF"
          echo "::notice::Dispatched production deploy of ${IMAGE_REF} to NamcheAI/infra. Outcome: https://github.com/NamcheAI/infra/actions/workflows/deploy-app.yml"
