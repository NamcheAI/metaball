<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaball Editor — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/theme.css" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: var(--font-sans);
        background: var(--page-bg);
        color: var(--text);
      }
      .card {
        width: min(100%, 360px);
        padding: 32px 28px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      .lead {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.85rem;
        font-weight: 500;
      }
      input[type='password'] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: 1.1rem;
        letter-spacing: 0.2em;
        text-align: center;
        background: var(--panel);
        color: var(--text);
      }
      input:focus-visible {
        outline: var(--focus-ring);
        outline-offset: var(--focus-offset);
        border-color: var(--accent);
      }
      button[type='submit'] {
        width: 100%;
        margin-top: 16px;
        padding: 12px 16px;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform var(--duration-fast) var(--ease-out),
          background var(--duration-fast) var(--ease-out);
      }
      @media (hover: hover) and (pointer: fine) {
        button[type='submit']:hover {
          background: #2a2a30;
        }
      }
      button[type='submit']:active {
        transform: scale(0.97);
      }
      .error {
        margin-bottom: 16px;
        padding: 10px 12px;
        border-radius: var(--radius-xs);
        background: var(--error-bg);
        color: var(--error-text);
        font-size: 0.85rem;
        opacity: 1;
        transform: translateY(0);
        transition:
          opacity var(--duration-ui) var(--ease-out),
          transform var(--duration-ui) var(--ease-out);
      }
      .error[hidden] {
        display: block;
        opacity: 0;
        transform: translateY(-4px);
        pointer-events: none;
        height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .legal-foot {
        margin-top: 24px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .legal-foot a {
        color: var(--muted);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color var(--duration-fast) var(--ease-out);
      }
      @media (hover: hover) and (pointer: fine) {
        .legal-foot a:hover {
          color: var(--text);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        button[type='submit']:active {
          transform: none;
        }
        .error {
          transition: opacity var(--duration-ui) var(--ease-out);
        }
        .error[hidden] {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Metaball Editor</h1>
      <p class="lead">Enter the PIN to open the editor.</p>
      <div id="error" class="error" hidden>Incorrect PIN. Try again.</div>
      <form method="POST" action="/api/auth" id="form">
        <label for="pin">PIN</label>
        <input
          id="pin"
          name="pin"
          type="password"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="12"
          required
          autofocus
        />
        <button type="submit">Continue</button>
      </form>
      <p class="legal-foot">
        <a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a> ·
        <a href="https://www.ruhmetc.com/" target="_blank" rel="noopener noreferrer">Ruhm etc.</a>
      </p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      if (error) {
        const errorElement = document.getElementById('error');
        if (error === 'rate') {
          errorElement.textContent = 'Too many attempts. Please wait before trying again.';
        }
        errorElement.hidden = false;
      }
      const from = params.get('from');
      if (from && from.startsWith('/') && !from.startsWith('//')) {
        const action = new URL('/api/auth', window.location.origin);
        action.searchParams.set('from', from);
        document.getElementById('form').action = action.pathname + action.search;
      }
    </script>
  </body>
</html>
